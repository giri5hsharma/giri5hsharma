<svg xmlns="http://www.w3.org/2000/svg" width="422" height="152" viewBox="0 0 422 152" role="img"><title>Gimbal simulator — Keep tracking through a missed frame.</title><defs><linearGradient id="bg" x2="1" y2="0.3" gradientUnits="objectBoundingBox"><stop stop-color="#151020"/><stop offset="1" stop-color="#261735"/></linearGradient></defs><style>.trace{stroke-dasharray:8 92;animation:trace 8s linear infinite}@keyframes trace{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="422" height="152" rx="3" fill="url(#bg)"/><text x="22" y="23" fill="#77ffd4" font-family="Menlo, monospace" font-size="13" font-weight="600">ROBOTICS  /  TRACKING</text><text x="21" y="61" fill="#f4edff" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Gimbal simulator</text><text x="22" y="93" fill="#c7b9da" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Keep tracking through a missed frame.</text><path d="M22 113h376" fill="none" stroke="#483252" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="22" y="137" fill="#bd91ff" font-family="Menlo, monospace" font-size="14" font-weight="500">detection → Kalman filter → pan/tilt</text><g transform="translate(348 5) scale(.78)"><path d="M0 15V4h13m26 0h13v11m0 14v11H39m-26 0H0V29" fill="none" stroke="#bd91ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M8 32Q29 34 43 12" fill="none" stroke="#77ffd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="34" cy="22" r="4" fill="#77ffd4"/></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title">
<title id="title">Girish Sharma — software and robotics. A terminal prompt sits inside a neon processor.</title>
<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#314056"/></pattern><clipPath id="typing"><rect class="reveal" x="76" y="230" width="493" height="44"/></clipPath></defs>
<style>.signal{stroke-dasharray:7 90;animation:flow 6s linear infinite}@keyframes flow{to{stroke-dashoffset:-194}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
.reveal{animation:type 6s steps(27,end) infinite}
.line{opacity:0;animation:cycle 18s step-end infinite}
.second{animation-delay:6s}.third{animation-delay:12s}
@keyframes type{0%{width:0}55%,94%{width:493px}100%{width:0}}
@keyframes cycle{0%{opacity:1}33.333%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.signal,.reveal,.line{animation:none}.first{opacity:1}}
</style>

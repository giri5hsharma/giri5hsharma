<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60" role="img"><title>Backend engineering, code grading and motion tracking</title><style>.mask{animation:type 4.8s steps(38,end) infinite}.row{opacity:0;animation:cycle 14.4s step-end infinite}.b{animation-delay:4.8s}.c{animation-delay:9.6s}@keyframes type{0%{width:0}57%,92%{width:585px}100%{width:0}}@keyframes cycle{0%{opacity:1}33.333%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.mask,.row{animation:none}.a{opacity:1}}</style><defs><clipPath id="clip"><rect class="mask" x="160" width="585" height="60"/></clipPath></defs><rect width="900" height="60" fill="#0c0d10"/><g clip-path="url(#clip)"><text x="450" y="37" font-family="monospace" font-size="20" fill="#fcee0a" text-anchor="middle" class="row a">BUILDING ASYNC APIs AT SAMANT SOLUTIONS</text><text x="450" y="37" font-family="monospace" font-size="20" fill="#fcee0a" text-anchor="middle" class="row b">QUEUING CODE SUBMISSIONS WITH REDIS</text><text x="450" y="37" font-family="monospace" font-size="20" fill="#fcee0a" text-anchor="middle" class="row c">TRACKING MOTION BETWEEN CAMERA FRAMES</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="142" viewBox="0 0 900 142" role="img" aria-labelledby="title">
<title id="title">Codemia grading pipeline. A submission moves through the Express API, Redis and Bull queue, and Piston runner before feedback reaches the dashboard.</title>
